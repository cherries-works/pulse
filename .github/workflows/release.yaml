
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            deb_arch: amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            deb_arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            make \
            libcriterion-dev \
            dpkg-dev \
            zlib1g-dev

      - name: Build
        run: |
          make clean
          make VERSION="${{ steps.version.outputs.version }}"

      - name: Package tarball
        run: |
          mkdir -p release
          tar -czf "release/pulse_Linux_${{ matrix.arch }}.tar.gz" \
            -C dist pulse

      - name: Package Debian
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DEB_ARCH: ${{ matrix.deb_arch }}
        run: |
          mkdir -p package/DEBIAN package/usr/bin

          cp dist/pulse package/usr/bin/pulse

          cat > package/DEBIAN/control <<EOF
          Package: pulse
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: ${DEB_ARCH}
          Maintainer: Cherries.works <mail@mertk.uk>
          Description: Lightweight Linux process monitor
           A lightweight process manager and monitoring tool.
          EOF

          dpkg-deb --root-owner-group --build \
            package "release/pulse_${VERSION}_${DEB_ARCH}.deb"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error

  rpm:
    name: Build Fedora RPM (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container:
      image: fedora:latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          dnf install -y \
            gcc \
            make \
            rpm-build \
            git \
            tar \
            gzip \
            zlib-devel

      - name: Get version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build RPM
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p ~/rpmbuild/SOURCES ~/rpmbuild/SPECS

          tar -czf ~/rpmbuild/SOURCES/pulse-${VERSION}.tar.gz \
            --exclude=.git \
            --transform="s,^,pulse-${VERSION}/," \
            .

          cp packaging/rpm/pulse.spec ~/rpmbuild/SPECS/

          rpmbuild -bb \
            --define "_pulse_version ${VERSION}" \
            ~/rpmbuild/SPECS/pulse.spec

          mkdir -p release
          cp ~/rpmbuild/RPMS/$(uname -m)/*.rpm release/

      - name: Upload RPM artifacts
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.arch }}
          path: release/*.rpm
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs:
      - build
      - rpm
    runs-on: ubuntu-24.04

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: release
          merge-multiple: true

      - name: Download RPM artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rpm-*
          path: release
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release
          sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
