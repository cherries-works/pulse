name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make
          sudo apt-get install -y libcriterion-dev

      - name: Test
        run: make test

      - name: Build
        run: make VERSION="${{ steps.version.outputs.version }}"

      - name: Package
        run: |
          mkdir -p release
          tar -czf release/pulse_Linux_x86_64.tar.gz \
            -C dist pulse

      - name: Generate checksums
        run: |
          cd release
          sha256sum pulse_Linux_x86_64.tar.gz > checksums.txt

      - name: Upload build
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: release/

  rpm:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          dnf install -y \
            gcc \
            make \
            rpm-build \
            git \
            tar \
            gzip

      - name: Get version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build RPM
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          mkdir -p ~/rpmbuild/SOURCES ~/rpmbuild/SPECS

          tar -czf ~/rpmbuild/SOURCES/pulse-${VERSION}.tar.gz \
            --exclude=.git \
            --transform="s,^,pulse-${VERSION}/," \
            .

          cp packaging/fedora/pulse.spec ~/rpmbuild/SPECS/

          rpmbuild -bb \
            --define "_pulse_version ${VERSION}" \
            ~/rpmbuild/SPECS/pulse.spec

          mkdir -p release
          cp ~/rpmbuild/RPMS/x86_64/*.rpm release/

      - name: Upload RPM
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: release/

  release:
    needs:
      - build
      - rpm
    runs-on: ubuntu-latest

    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: release
          path: release

      - name: Download RPM
        uses: actions/download-artifact@v4
        with:
          name: rpm
          path: release

      - name: Create GitHub Release
        if: ${{ !env.ACT }}
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/pulse_Linux_x86_64.tar.gz
            release/checksums.txt
            release/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}